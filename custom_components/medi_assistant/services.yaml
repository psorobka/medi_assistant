list_booking_offers:
  name: Pokaż terminy do rezerwacji
  description: Wyświetla szukajki wszystkich kont i znalezione terminy. Opcjonalnie wybierz jedną szukajkę.
  fields:
    entity_id:
      name: Szukajka Medicover
      required: false
      selector:
        entity:
          filter:
            - integration: medi_assistant
              domain: sensor
    refresh:
      name: Odśwież wyniki szukajek
      description: Pobiera nowe wyniki dla listy wszystkich szukajek.
      default: false
      selector:
        boolean:
book_appointment:
  name: Zarezerwuj wizytę
  description: Rezerwuje dokładnie wskazany termin. Identyfikator z sensora wygasa po 30 minutach lub po restarcie HA. Zwraca wynik do automatyzacji.
  fields:
    booking_id:
      name: Identyfikator rezerwacji
      description: Pole booking_id z atrybutu appointments sensora Medicover.
      required: true
      selector:
        text:

list_booked_appointments:
  name: Pokaż zarezerwowane wizyty
  description: Wyświetla zaplanowane wizyty wszystkich kont. Opcjonalnie wybierz szukajkę, aby ograniczyć wynik do jej konta.
  fields:
    entity_id:
      name: Szukajka konta Medicover
      required: false
      selector:
        entity:
          filter:
            - integration: medi_assistant
              domain: sensor
cancel_appointment:
  name: Odwołaj wizytę
  description: Odwołuje wskazaną wizytę. Wymaga cancellation_id z listy zarezerwowanych wizyt, ważnego przez 30 minut lub do restartu HA.
  fields:
    cancellation_id:
      name: Identyfikator odwołania
      required: true
      selector:
        text:
    confirm_late_cancellation:
      name: Potwierdzam późne odwołanie
      description: Włącz po sprawdzeniu warunków późnego odwołania wizyty w Medicover.
      default: false
      selector:
        boolean:

get_search_filters:
  name: Pobierz filtry szukajki
  description: Bez parametrów zwraca załadowane konta. Podaj konto, następnie region i specjalizację, aby pobrać kolejne filtry.
  fields:
    account_id:
      name: Konto Medi Assistant
      description: "Identyfikator konta z get_search_filters."
      required: false
      selector: {"config_entry": {"integration": "medi_assistant"}}
    region_id:
      name: Region
      description: "Identyfikator regionu z get_search_filters."
      required: false
      selector: {"number": {"min": 1, "mode": "box"}}
    specialty_id:
      name: Specjalizacja
      description: "Identyfikator specjalizacji dostępnej w wybranym regionie."
      required: false
      selector: {"number": {"min": 1, "mode": "box"}}

create_search:
  name: Utwórz szukajkę
  description: Tworzy szukajkę edytowalną w konfiguracji HA. Identyczne ponowienie zwraca istniejącą szukajkę.
  fields:
    account_id:
      name: Konto Medi Assistant
      description: "Identyfikator konta z get_search_filters."
      required: true
      selector: {"config_entry": {"integration": "medi_assistant"}}
    region_id:
      name: Region
      description: "Identyfikator regionu z get_search_filters."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    specialty_id:
      name: Specjalizacja
      description: "Identyfikator specjalizacji dostępnej w wybranym regionie."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    clinic_id:
      name: Placówka
      description: "Opcjonalny identyfikator placówki z filtrów."
      required: false
      selector: {"number": {"min": 1, "mode": "box"}}
    doctor_id:
      name: Lekarz
      description: "Opcjonalny identyfikator lekarza z filtrów."
      required: false
      selector: {"number": {"min": 1, "mode": "box"}}
    language_id:
      name: Język
      description: "4: polski, 6: angielski, 60: ukraiński."
      required: false
      selector: {"number": {"min": 1, "mode": "box"}}
    date_from:
      name: Data początkowa
      description: "Data w formacie RRRR-MM-DD."
      required: false
      selector: {"date": {}}
    date_to:
      name: Data końcowa
      description: "Data w formacie RRRR-MM-DD."
      required: false
      selector: {"date": {}}
    notify_target:
      name: Powiadomienia
      description: "Lista celów notify, taka jak w formularzu szukajki."
      required: false
      selector: {"object": {}}
