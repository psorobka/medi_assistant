name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements_dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Pytest (loads into Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements_test.txt
      - run: pytest -q --cov --cov-report=term-missing --cov-fail-under=90
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Appointments card interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:frontend

  browser:
    name: Chromium card tests (desktop and phone)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Upload synthetic browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: card-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  hassfest:
    name: Hassfest (manifest validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
          # The integration is not (yet) published in the home-assistant/brands
          # repo; skip that check so validation passes for a custom repository.
          ignore: brands
